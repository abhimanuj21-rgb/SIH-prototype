# Netlify hosts the React website. The Python API runs separately (Render —
# see render.yaml) and the site reaches it through VITE_API_BASE, which you set
# in Netlify: Site configuration → Environment variables →
#   VITE_API_BASE = https://<your-render-service>.onrender.com/api/v1
[build]
  base = "frontend"
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Single-page app: every route (e.g. a shared /app/intelligence?lat=..&lon=..
# link) serves index.html and React Router takes over.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
